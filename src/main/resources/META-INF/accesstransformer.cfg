# ExperienceOrb.count — the number of merged units still held by one orb entity, distinct from
# the public `value`, which is what a SINGLE unit is worth. WC-01's Mending distributor must
# decrement count (never rewrite value) when it completes a pickup itself, or every remaining
# unit of a merged orb is silently devalued.

# An AT rather than a mixin @Accessor deliberately: this is read AND written on the XP-pickup
# tick path, and an AT compiles to a plain getfield/putfield with no interface dispatch. It is
# also the only form that survives reobfuscation here — this project generates no refmap, so a
# vanilla SOURCE name inside a mixin annotation resolves in dev and fails in a release jar,
# whereas ForgeGradle remaps this SRG name for both.
public net.minecraft.world.entity.ExperienceOrb f_147072_ # count
